[EMC]
MACHINE = Mazak VQC 20/40 Mesa Retrofit
DEBUG = 0
VERSION = 1.1

[DISPLAY]
DISPLAY = axis
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 1.2
MAX_SPINDLE_OVERRIDE = 1.2
MIN_SPINDLE_OVERRIDE = 0.5
INTRO_GRAPHIC = linuxcnc.gif
INTRO_TIME = 3
PROGRAM_PREFIX = ~/linuxcnc/nc_files
INCREMENTS = 0.0001in 0.001in 0.01in 0.1in

[KINS]
KINEMATICS = trivkins coordinates=XYZ
JOINTS = 3

[TRAJ]
COORDINATES = X Y Z
LINEAR_UNITS = inch
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 1.0
MAX_LINEAR_VELOCITY = 5.0

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
BASE_PERIOD = 0
SERVO_PERIOD = 1000000

[HAL]
HALFILE = mazak_vqc_20_40.hal
HALFILE = motion_7i80hdt.hal
HALFILE = field_7i84u.hal
HALFILE = atc_orient.hal
# Optional after pendant driver is installed and tested:
# HALFILE = pendant_whb04b.hal
POSTGUI_HALFILE = postgui.hal
HALUI = halui

[HALUI]
MDI_COMMAND = G53 G0 Z0

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl
# TOOL_CHANGE_POSITION / TOOL_CHANGE_QUILL_UP only apply to the built-in M6.
# M6 is remapped below, so they're ignored - real ATC positions live in [ATC].

[RS274NGC]
PARAMETER_FILE = linuxcnc.var
SUBROUTINE_PATH = remap
REMAP = M6 modalgroup=6 ngc=toolchange
# Task-level abort cleanup for the ATC remap. LinuxCNC calls this O-word
# sub whenever program execution is aborted for any reason enumerated in
# nml_intf/emc.hh (EMC_ABORT_TASK_EXEC_ERROR, EMC_ABORT_TASK_ABORT from
# operator Abort / halui.abort, EMC_ABORT_AUX_ESTOP, etc.). This is the
# ONLY guaranteed cleanup path for the digital-out P0..P7 pins that
# toolchange.ngc raises inside the ATC sequence; without it every
# (abort, ...) inside a timeout leaves the barrier / unclamp / index /
# cover / orient outputs latched in whatever state the interpreter last
# wrote. See linuxcnc/remap/on_abort.ngc for the safe-order drop.
# Primary source: https://linuxcnc.org/docs/html/remap/remap.html
ON_ABORT_COMMAND = O <on_abort> call
# Deliberately no prolog/epilog - see linuxcnc/atc_orient.ini.snippet section 3.

# Reference points and timeouts used by remap/toolchange.ngc, read as #<_ini[ATC]NAME>.
# VALUES FILLED 2026-07-28 from the live control's MACH CONSTANT PAR NO.2 screen
# (RP1-RP3 "2nd zero point"; see docs/parameters_sn060231.md). G53 machine coordinates,
# inches. VERIFY with a dry run at reduced rapid before trusting - atc-live-permit stays 0.
[ATC]
# ref-1: pot exchange height - Z down, toolholder engaged in the pot (RP3).
REF1_Z = -5.9055
# ref-2: clearance height - Z up, clear of the magazine (machine zero).
REF2_Z = 0.0
# Y positions: ref-1 = machining/park side (machine zero), ref-2 = magazine side
# (RP2 - outside the standing +0.0394 machining soft limit). REF2_Y cannot be
# reached until the proposed ATC-zone authorization path is implemented and
# verified; atc-live-permit must remain 0 (dry-run) in the meantime.
REF1_Y = 0.0
REF2_Y = 9.5000

# Waits inside the remap, seconds. Each must be LONGER than the matching component
# watchdog so the component's own alarm identifies the failure, not a bare timeout.
ORIENT_TIMEOUT  = 15.0
CONFIRM_TIMEOUT = 10.0
INDEX_TIMEOUT   = 40.0

# DRY_RUN retired: dry-run authority moved to the HAL bit `atc-live-permit`
# (mazak_vqc_20_40.hal, default 0 = dry-run). That single bit both holds the
# spindle motion permit FALSE and is read by the remap via motion.digital-in-15,
# so no FR-SX path can cut while a dry-run M6 is spoofing the tool. This key is
# no longer consulted by the remap; do not re-add it as a second source of truth.

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[AXIS_X]
# Soft limits from live M-2 params (docs/parameters_sn060231.md, main envelope box):
# LX1 = +0.0394 in, LX2 = -39.4094 in.
MIN_LIMIT = -39.4094
MAX_LIMIT = 0.0394
MAX_VELOCITY = 1.0
MAX_ACCELERATION = 5.0

[JOINT_0]
TYPE = LINEAR
HOME = 0.0
MIN_LIMIT = -39.4094
MAX_LIMIT = 0.0394
MAX_VELOCITY = 1.0
MAX_ACCELERATION = 5.0
BACKLASH = 0.0
SCALE = 1.0
FERROR = 0.050
MIN_FERROR = 0.010
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0.1
HOME_LATCH_VEL = 0.02
HOME_SEQUENCE = 1
P = 0
I = 0
D = 0
FF0 = 0
FF1 = 0
FF2 = 0
BIAS = 0
DEADBAND = 0
# Initial commissioning clamp: with placeholder OUTPUT_SCALE=1.0 this limits
# the 7i49 request to about +/-1 V. Replace only from measured volts-per-speed
# data; MAX_OUTPUT is in PID engineering units, not volts.
MAX_OUTPUT = 0.10
# PID error clamp — prevents output windup on large following errors.
# Set to 2x FERROR as a conservative starting point; tune after initial bring-up.
MAX_ERROR = 0.100
# 7i49 resolver parameters — see motion_7i80hdt.hal for units and derivation.
#   RESOLVER_SCALE:          machine units per RESOLVER ELECTRICAL revolution
#                            (signed; negative flips axis direction). Derive
#                            from ballscrew lead × any resolver/screw ratio.
#                            PLACEHOLDER 1.0 = one inch per resolver rev — NOT
#                            correct on any real ballscrew. MUST be measured
#                            (dial indicator vs. rawcounts over multiple full
#                            revolutions) before running the axis.
#   RESOLVER_VELOCITY_SCALE: conversion between resolver rotation speed and
#                            machine velocity. Set to the SAME signed value as
#                            RESOLVER_SCALE so .velocity reads in/s. This is an
#                            independent parameter, not derived from .scale.
#   RESOLVER_INDEX_DIVISOR:  cycles per rev of the resolver itself. TS2014N
#                            K=0.5 is a single-speed BRX resolver → 1 is
#                            expected; verify from the exact suffix datasheet.
#                            HostMot2 doc: 'It is not appropriate to use this
#                            parameter for index-homing of axis drives.'
#                            Homing on this machine is switch-based
#                            (HOME_USE_INDEX = NO by default).
RESOLVER_SCALE = 1.0
RESOLVER_VELOCITY_SCALE = 1.0
RESOLVER_INDEX_DIVISOR = 1
# OUTPUT_SCALE: pwmgen scale for the 7i49 +/-10V DAC (motion_7i80hdt.hal).
# Per the HostMot2 PWMGen doc: duty = pwmgen.value / scale, clipped to +/-1.0.
# On the 7i49 the pwmgen output feeds a bipolar +/-10V analog output stage,
# so duty +/-1.0 = +/-10V. Setting OUTPUT_SCALE = MAX_VELOCITY (in/s) maps
# a PID output equal to MAX_VELOCITY to +/-10V ONLY IF the TRA drive is
# calibrated so +/-10V equals +/-MAX_VELOCITY of shaft speed after any
# resolver/screw ratio. That calibration is NOT known yet; the placeholder
# 1.0 below is inert only while the zero PID gains and output holds remain in
# force; it is not a safe commissioned scale (PID output 1.0 -> +10V). It must
# be adjusted per axis after the volts-per-speed measurement in
# docs/servo_commissioning.md step 3. Do NOT tune P/I/D or FF1 until that
# measurement is done.
OUTPUT_SCALE = 1.0

[AXIS_Y]
# Soft limits from live M-2 params (docs/parameters_sn060231.md).
# MAX_LIMIT is +0.0394 (LY1, main machining envelope).
#
# The OEM stored TWO Y soft-limit boxes (LY1 main + LY3 ATC AREA) and used
# the OTNEG 'soft-OT-neglect' bit inside its ATC macro to reach RP2 = +9.5.
# LinuxCNC soft limits are global - they are enforced by the motion
# controller for jog, MDI, program, and remap alike, with no built-in
# per-sub authorization mechanism. Widening MAX_LIMIT to +9.5000 to let
# the remap reach RP2 exposes the ATC zone to ANY G-code or MDI command
# and cannot serve as a safety gate.
#
# ATC-zone authorization is being redesigned via a dedicated M100/M101
# permit pair and a mazak_atc_zone HAL component that dynamically drives the
# documented ini.y.max_limit HAL input only after prerequisites are met (spindle oriented,
# Z above ATC-area floor, PRS-55/66 consistent, no faults). Until that is
# implemented and validated, the remap will not tool-change and
# the HAL bit atc-live-permit stays 0 (dry-run) to block real ATC motion.
#
# See docs/y_soft_limit_atc_zone.md for the full design.
MIN_LIMIT = -30.0394
MAX_LIMIT =   0.0394
MAX_VELOCITY = 1.0
MAX_ACCELERATION = 5.0

[JOINT_1]
TYPE = LINEAR
HOME = 0.0
MIN_LIMIT = -30.0394
MAX_LIMIT =   0.0394
MAX_VELOCITY = 1.0
MAX_ACCELERATION = 5.0
BACKLASH = 0.0
SCALE = 1.0
FERROR = 0.050
MIN_FERROR = 0.010
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0.1
HOME_LATCH_VEL = 0.02
HOME_SEQUENCE = 2
P = 0
I = 0
D = 0
FF0 = 0
FF1 = 0
FF2 = 0
BIAS = 0
DEADBAND = 0
MAX_OUTPUT = 0.10
MAX_ERROR = 0.100
# 7i49 resolver — see [JOINT_0] block above for units and derivation.
RESOLVER_SCALE = 1.0
RESOLVER_VELOCITY_SCALE = 1.0
RESOLVER_INDEX_DIVISOR = 1
OUTPUT_SCALE = 1.0

[AXIS_Z]
# Soft limits from live M-2 params (docs/parameters_sn060231.md, main envelope box):
# LZ1 = +0.0394 in, LZ2 = -18.1496 in.
MIN_LIMIT = -18.1496
MAX_LIMIT = 0.0394
MAX_VELOCITY = 1.0
MAX_ACCELERATION = 5.0

[JOINT_2]
TYPE = LINEAR
HOME = 0.0
MIN_LIMIT = -18.1496
MAX_LIMIT = 0.0394
MAX_VELOCITY = 1.0
MAX_ACCELERATION = 5.0
BACKLASH = 0.0
SCALE = 1.0
FERROR = 0.050
MIN_FERROR = 0.010
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0.1
HOME_LATCH_VEL = 0.02
HOME_SEQUENCE = 0
P = 0
I = 0
D = 0
FF0 = 0
FF1 = 0
FF2 = 0
BIAS = 0
DEADBAND = 0
MAX_OUTPUT = 0.10
MAX_ERROR = 0.100
# 7i49 resolver — see [JOINT_0] block above for units and derivation.
RESOLVER_SCALE = 1.0
RESOLVER_VELOCITY_SCALE = 1.0
RESOLVER_INDEX_DIVISOR = 1
OUTPUT_SCALE = 1.0

[SPINDLE_0]
MAX_FORWARD_VELOCITY = 4000
MAX_REVERSE_VELOCITY = 4000
MIN_FORWARD_VELOCITY = 0
MIN_REVERSE_VELOCITY = 0
# Spindle PID — gains are 0 (open-loop) until closed-loop spindle feedback is
# verified. Once machine-side encoder feedback (hm2_7i80.0.encoder.NN.velocity) is
# confirmed, tune FF1 first (speed feedforward), then add P. MAX_ERROR and
# MAX_OUTPUT limit the closed-loop authority.
P = 0
I = 0
D = 0
FF0 = 0
FF1 = 0
FF2 = 0
BIAS = 0
DEADBAND = 0
MAX_OUTPUT = 10.0
MAX_ERROR = 200
# OUTPUT_SCALE: pwmgen scale for the 7i49 spindle analog output (7i49 AOUT3).
# duty = spindle.0.speed-out / OUTPUT_SCALE, clipped to +/-1.0. spindle.0.speed-out
# is in RPM, so setting OUTPUT_SCALE to the machine's actual max spindle RPM maps
# full-scale +10V to max-RPM. Nameplate max on this class of machine is 4000
# RPM (matches MAX_FORWARD_VELOCITY above). Previous value of 10 made 10 RPM
# equal to full-scale output - a load-blocking bug corrected 2026-08-06.
OUTPUT_SCALE = 4000
