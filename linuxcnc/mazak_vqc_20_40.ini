[EMC]
MACHINE = Mazak VQC 20/40 Mesa Retrofit
DEBUG = 0
VERSION = 1.2

[DISPLAY]
# QtVCP "QtDragon HD" touchscreen HMI. Replaces Axis (was `DISPLAY = axis`
# through v1.1) per the CLAUDE.md brief, which calls for a touchscreen HMI.
# Add `-d` after `qtvcp` for debug output to the terminal while commissioning.
#
# SCREEN VARIANT IS A HARDWARE DECISION, NOT A PREFERENCE. qtdragon_hd is laid
# out for 1920x1080 landscape. The alternatives are `qtdragon` (smaller, ~1024x768)
# and `qtdragon_hd_vert` (portrait). Custom tabs are positioned per-variant, so
# any ATC/hydraulic tab work done here must be redone if the panel changes.
# UNVERIFIED: the cabinet panel has not been chosen. Drafted against the bench
# monitor currently on the OptiPlex (HDMI-1, 3440x1440).
DISPLAY = qtvcp qtdragon_hd
TITLE = Mazak VQC 20/40 — LinuxCNC
ICON = silver_dragon.png

# QtDragon writes operator preferences (units, themes, probe settings) here
# rather than to this INI. WORKINGFOLDER resolves to this config directory.
PREFERENCE_FILE_PATH = WORKINGFOLDER/qtdragon_hd.pref
LOG_FILE = qtdragon_hd.log

POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
CYCLE_TIME = 100
INTRO_GRAPHIC = silver_dragon.png
INTRO_TIME = 2
PROGRAM_PREFIX = ~/linuxcnc/nc_files

# --- Overrides -------------------------------------------------------------
# qtvcp/qt_istat.py reads the indexed MAX_SPINDLE_0_* form first and falls back
# to the unindexed legacy names only if the indexed key is absent. Both forms
# are kept: the indexed pair is what QtDragon consumes, the legacy pair is what
# Axis and halui read, and they must not be allowed to drift apart.
MAX_FEED_OVERRIDE = 1.2
MAX_SPINDLE_0_OVERRIDE = 1.2
MIN_SPINDLE_0_OVERRIDE = 0.5
MAX_SPINDLE_OVERRIDE = 1.2
MIN_SPINDLE_OVERRIDE = 0.5

# --- Spindle display -------------------------------------------------------
# These drive the QtDragon speed slider and gauge ONLY. They do not command the
# machine; [SPINDLE_0] and the 7i49 AOUT3 scaling do that.
#
# !! UNRESOLVED CONFLICT — DO NOT RAISE THESE WITHOUT READING THIS !!
# Two repo sources disagree on this machine's top spindle speed:
#   4000 RPM — [SPINDLE_0] MAX_FORWARD_VELOCITY / OUTPUT_SCALE in this file,
#              justified by a comment asserting "nameplate max on this class
#              of machine is 4000 RPM".
#   6000 RPM — the SX-CPU2 board sticker `BASE 1500 RPM / TOP 6000 RPM`
#              (background/frsx_orient_detector_capture.md line 58), and the
#              spindle motor's own photographed nameplate, whose ratings table
#              is columned @1500 / @4500 / @6000 rpm
#              (docs/spindle_motor_plg_encoder.md line 194).
# The 6000 figure is read off two physical labels; the 4000 figure is an
# assertion about the machine "class" with no cited nameplate. If 6000 is the
# true top speed then [SPINDLE_0] OUTPUT_SCALE = 4000 is wrong by 1.5x and every
# commanded speed would run 50% fast, because BBIA-1 CN4-20 (SE3) is labelled
# "SPEED REFERENCE 3 (10V MAX SPEED)" — 10 V means top speed, whatever that is.
# Deliberately set to 4000 here to match [SPINDLE_0] rather than silently
# adopting 6000: the GUI must never offer a speed the motion config will not
# honour, and low is the safe direction to be wrong. Resolve by meter/tach at
# commissioning step 12 BEFORE the spindle turns, then correct both together.
MAX_SPINDLE_0_SPEED = 4000
# Matches [SPINDLE_0] MIN_FORWARD_VELOCITY = 0. The FR-SX's real usable low-speed
# floor is UNVERIFIED — the drive's BASE is 1500 RPM, below which it is in the
# constant-torque region. Commissioning determines the practical minimum.
MIN_SPINDLE_0_SPEED = 0
# Conservative commissioning start point, NOT a machine fact. Bring-up order
# item "spindle at low RPM" (docs/project_status.md) governs; raise only after
# analog scaling and direction are proven.
DEFAULT_SPINDLE_0_SPEED = 500
SPINDLE_INCREMENT = 100
# Full-scale of QtDragon's spindle power bar, in watts. 5.5 kW is the half-hour
# rating on the motor nameplate and matches the drive identified as FR-SX-2-5.5K
# (docs/spindle_motor_plg_encoder.md); continuous rating is 3.7 kW @1500 rpm.
# INERT until a spindle load signal exists — [SPINDLE_0] PID gains are all 0
# (open loop) and no spindle feedback is wired, so this bar reads nothing yet.
MAX_SPINDLE_POWER = 5500

# --- Jogging ---------------------------------------------------------------
# QtDragon takes jog velocities in machine units/sec. [TRAJ] LINEAR_UNITS = inch,
# so these are in/s: 5.0 in/s = 300 IPM. Both values are carried straight from
# [TRAJ] MAX_LINEAR_VELOCITY and DEFAULT_LINEAR_VELOCITY so the jog slider cannot
# request more than the trajectory planner allows.
MIN_LINEAR_VELOCITY = 0
MAX_LINEAR_VELOCITY = 5.0
DEFAULT_LINEAR_VELOCITY = 1.0
# qt_istat.py splits on commas when present, else on whitespace, and inserts
# "Continuous" at index 0 itself. Same four inch steps carried over from the
# Axis configuration.
INCREMENTS = 0.0001 in, 0.001 in, 0.01 in, 0.1 in

# NGCGUI is deliberately NOT enabled. Its NGCGUI_SUBFILE_PATH must also appear in
# [RS274NGC] SUBROUTINE_PATH, which currently carries only `remap` for the M6 ATC
# remap and on_abort cleanup. Do not widen that path casually — see the
# ON_ABORT_COMMAND comment in [RS274NGC].

[KINS]
KINEMATICS = trivkins coordinates=XYZ
JOINTS = 3

[TRAJ]
COORDINATES = X Y Z
LINEAR_UNITS = inch
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 1.0
MAX_LINEAR_VELOCITY = 5.0

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
BASE_PERIOD = 0
# 2 ms, not the LinuxCNC-default 1 ms. Bench-measured 2026-08-21: the hm2_eth
# round trip to the 7i80HDT costs ~435 us irreducibly (a bare board with zero
# modules loaded still costs that; the 7i84 sserial poll adds only ~42 us), and
# servo-thread max-time reaches ~1.07 ms with the box idle. A 1 ms period
# therefore overruns even in the best case. Kernel latency is not the cause --
# cyclictest -p80 under load measured 62 us max. See
# docs/hm2_eth_nic_validation.md.
SERVO_PERIOD = 2000000

[HAL]
HALFILE = mazak_vqc_20_40.hal
HALFILE = motion_7i80hdt.hal
HALFILE = field_7i84u.hal
HALFILE = atc_orient.hal
# Optional after pendant driver is installed and tested:
# HALFILE = pendant_whb04b.hal
POSTGUI_HALFILE = postgui.hal
HALUI = halui

[HALUI]
MDI_COMMAND = G53 G0 Z0

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl
# TOOL_CHANGE_POSITION / TOOL_CHANGE_QUILL_UP only apply to the built-in M6.
# M6 is remapped below, so they're ignored - real ATC positions live in [ATC].

[RS274NGC]
PARAMETER_FILE = linuxcnc.var
SUBROUTINE_PATH = remap
REMAP = M6 modalgroup=6 ngc=toolchange
# Task-level abort cleanup for the ATC remap. LinuxCNC calls this O-word
# sub whenever program execution is aborted for any reason enumerated in
# nml_intf/emc.hh (EMC_ABORT_TASK_EXEC_ERROR, EMC_ABORT_TASK_ABORT from
# operator Abort / halui.abort, EMC_ABORT_AUX_ESTOP, etc.). This is the
# ONLY guaranteed cleanup path for the digital-out P0..P7 pins that
# toolchange.ngc raises inside the ATC sequence; without it every
# (abort, ...) inside a timeout leaves the barrier / unclamp / index /
# cover / orient outputs latched in whatever state the interpreter last
# wrote. See linuxcnc/remap/on_abort.ngc for the safe-order drop.
# Primary source: https://linuxcnc.org/docs/html/remap/remap.html
ON_ABORT_COMMAND = O <on_abort> call
# Deliberately no prolog/epilog - see linuxcnc/atc_orient.ini.snippet section 3.

# Reference points and timeouts used by remap/toolchange.ngc, read as #<_ini[ATC]NAME>.
# VALUES FILLED 2026-07-28 from the live control's MACH CONSTANT PAR NO.2 screen
# (RP1-RP3 "2nd zero point"; see docs/parameters_sn060231.md). G53 machine coordinates,
# inches. VERIFY with a dry run at reduced rapid before trusting - atc-live-permit stays 0.
[ATC]
# ref-1: pot exchange height - Z down, toolholder engaged in the pot (RP3).
REF1_Z = -5.9055
# ref-2: clearance height - Z up, clear of the magazine (machine zero).
REF2_Z = 0.0
# Y positions: ref-1 = machining/park side (machine zero), ref-2 = magazine side
# (RP2 - outside the standing +0.0394 machining soft limit). REF2_Y cannot be
# reached until the proposed ATC-zone authorization path is implemented and
# verified; atc-live-permit must remain 0 (dry-run) in the meantime.
REF1_Y = 0.0
REF2_Y = 9.5000

# Waits inside the remap, seconds. Each must be LONGER than the matching component
# watchdog so the component's own alarm identifies the failure, not a bare timeout.
ORIENT_TIMEOUT  = 15.0
CONFIRM_TIMEOUT = 10.0
INDEX_TIMEOUT   = 40.0

# DRY_RUN retired: dry-run authority moved to the HAL bit `atc-live-permit`
# (mazak_vqc_20_40.hal, default 0 = dry-run). That single bit both holds the
# spindle motion permit FALSE and is read by the remap via motion.digital-in-15,
# so no FR-SX path can cut while a dry-run M6 is spoofing the tool. This key is
# no longer consulted by the remap; do not re-add it as a second source of truth.

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[AXIS_X]
# Soft limits from live M-2 params (docs/parameters_sn060231.md, main envelope box):
# LX1 = +0.0394 in, LX2 = -39.4094 in.
MIN_LIMIT = -39.4094
MAX_LIMIT = 0.0394
MAX_VELOCITY = 1.0
MAX_ACCELERATION = 5.0

[JOINT_0]
TYPE = LINEAR
HOME = 0.0
MIN_LIMIT = -39.4094
MAX_LIMIT = 0.0394
MAX_VELOCITY = 1.0
MAX_ACCELERATION = 5.0
BACKLASH = 0.0
SCALE = 1.0
FERROR = 0.050
MIN_FERROR = 0.010
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0.1
HOME_LATCH_VEL = 0.02
HOME_SEQUENCE = 1
P = 0
I = 0
D = 0
FF0 = 0
FF1 = 0
FF2 = 0
BIAS = 0
DEADBAND = 0
# Initial commissioning clamp: with placeholder OUTPUT_SCALE=1.0 this limits
# the 7i49 request to about +/-1 V. Replace only from measured volts-per-speed
# data; MAX_OUTPUT is in PID engineering units, not volts.
MAX_OUTPUT = 0.10
# PID error clamp — prevents output windup on large following errors.
# Set to 2x FERROR as a conservative starting point; tune after initial bring-up.
MAX_ERROR = 0.100
# 7i49 resolver parameters — see motion_7i80hdt.hal for units and derivation.
#   RESOLVER_SCALE:          machine units per RESOLVER ELECTRICAL revolution
#                            (signed; negative flips axis direction). Derive
#                            from ballscrew lead × any resolver/screw ratio.
#                            PLACEHOLDER 1.0 = one inch per resolver rev — NOT
#                            correct on any real ballscrew. MUST be measured
#                            (dial indicator vs. rawcounts over multiple full
#                            revolutions) before running the axis.
#   RESOLVER_VELOCITY_SCALE: conversion between resolver rotation speed and
#                            machine velocity. Set to the SAME signed value as
#                            RESOLVER_SCALE so .velocity reads in/s. This is an
#                            independent parameter, not derived from .scale.
#   RESOLVER_INDEX_DIVISOR:  cycles per rev of the resolver itself (HostMot2:
#                            'set to the number of cycles per rev of the
#                            resolver'). SET TO 5 on 2026-08-17. The earlier
#                            comment here expected 1, a single-speed detector;
#                            that expectation is WRONG and was never sourced.
#                            The detector is multi-pole (M2 Maintenance Manual
#                            Table 14.3-1, §14.2, §6.7.1), and:
#                              ballscrew lead .... 10.000 mm  MEASURED at the
#                                                  machine 2026-08-17 on ALL
#                                                  THREE axes (each screw
#                                                  hand-turned 1 rev = 10 mm)
#                              resolver coupling . 1:1, MIKI PULLEY ARM-100,
#                                                  equal 9.52 mm bores (OEM
#                                                  parts list 413LE02A000.pdf
#                                                  p. 49)
#                              grid spacing ...... 2.000 mm per ELECTRICAL rev
#                                                  (4000/tau, tau = 2 from
#                                                  MC1-MC4 = 784) -- DERIVED
#                              => cycles/rev ..... 10.000 / 2.000 = 5
#                            Confirm on the machine with the rawcounts-vs-turns
#                            measurement: expect 5 electrical cycles per full
#                            BALLSCREW revolution. If it is not 5, tau is wrong
#                            and RESOLVER_SCALE below is wrong with it.
#                            Details: docs/ballscrew_lead_2026-08-17.md
#                            HostMot2 doc: 'It is not appropriate to use this
#                            parameter for index-homing of axis drives.'
#                            Homing on this machine is switch-based
#                            (HOME_USE_INDEX = NO by default), so this value
#                            does not affect homing.
RESOLVER_SCALE = 1.0
RESOLVER_VELOCITY_SCALE = 1.0
RESOLVER_INDEX_DIVISOR = 5
# OUTPUT_SCALE: pwmgen scale for the 7i49 +/-10V DAC (motion_7i80hdt.hal).
# Per the HostMot2 PWMGen doc: duty = pwmgen.value / scale, clipped to +/-1.0.
# On the 7i49 the pwmgen output feeds a bipolar +/-10V analog output stage,
# so duty +/-1.0 = +/-10V. Setting OUTPUT_SCALE = MAX_VELOCITY (in/s) maps
# a PID output equal to MAX_VELOCITY to +/-10V ONLY IF the TRA drive is
# calibrated so +/-10V equals +/-MAX_VELOCITY of shaft speed after any
# resolver/screw ratio. That calibration is NOT known yet; the placeholder
# 1.0 below is inert only while the zero PID gains and output holds remain in
# force; it is not a safe commissioned scale (PID output 1.0 -> +10V). It must
# be adjusted per axis after the volts-per-speed measurement in
# docs/servo_commissioning.md step 3. Do NOT tune P/I/D or FF1 until that
# measurement is done.
OUTPUT_SCALE = 1.0

[AXIS_Y]
# Soft limits from live M-2 params (docs/parameters_sn060231.md).
# MAX_LIMIT is +0.0394 (LY1, main machining envelope).
#
# The OEM stored TWO Y soft-limit boxes (LY1 main + LY3 ATC AREA) and used
# the OTNEG 'soft-OT-neglect' bit inside its ATC macro to reach RP2 = +9.5.
# LinuxCNC soft limits are global - they are enforced by the motion
# controller for jog, MDI, program, and remap alike, with no built-in
# per-sub authorization mechanism. Widening MAX_LIMIT to +9.5000 to let
# the remap reach RP2 exposes the ATC zone to ANY G-code or MDI command
# and cannot serve as a safety gate.
#
# ATC-zone authorization is being redesigned via a dedicated M100/M101
# permit pair and a mazak_atc_zone HAL component that dynamically drives the
# documented ini.y.max_limit HAL input only after prerequisites are met (spindle oriented,
# Z above ATC-area floor, PRS-55/66 consistent, no faults). Until that is
# implemented and validated, the remap will not tool-change and
# the HAL bit atc-live-permit stays 0 (dry-run) to block real ATC motion.
#
# See docs/y_soft_limit_atc_zone.md for the full design.
MIN_LIMIT = -30.0394
MAX_LIMIT =   0.0394
MAX_VELOCITY = 1.0
MAX_ACCELERATION = 5.0

[JOINT_1]
TYPE = LINEAR
HOME = 0.0
MIN_LIMIT = -30.0394
MAX_LIMIT =   0.0394
MAX_VELOCITY = 1.0
MAX_ACCELERATION = 5.0
BACKLASH = 0.0
SCALE = 1.0
FERROR = 0.050
MIN_FERROR = 0.010
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0.1
HOME_LATCH_VEL = 0.02
HOME_SEQUENCE = 2
P = 0
I = 0
D = 0
FF0 = 0
FF1 = 0
FF2 = 0
BIAS = 0
DEADBAND = 0
MAX_OUTPUT = 0.10
MAX_ERROR = 0.100
# 7i49 resolver — see [JOINT_0] block above for units and derivation.
RESOLVER_SCALE = 1.0
RESOLVER_VELOCITY_SCALE = 1.0
RESOLVER_INDEX_DIVISOR = 5
OUTPUT_SCALE = 1.0

[AXIS_Z]
# Soft limits from live M-2 params (docs/parameters_sn060231.md, main envelope box):
# LZ1 = +0.0394 in, LZ2 = -18.1496 in.
MIN_LIMIT = -18.1496
MAX_LIMIT = 0.0394
MAX_VELOCITY = 1.0
MAX_ACCELERATION = 5.0

[JOINT_2]
TYPE = LINEAR
HOME = 0.0
MIN_LIMIT = -18.1496
MAX_LIMIT = 0.0394
MAX_VELOCITY = 1.0
MAX_ACCELERATION = 5.0
BACKLASH = 0.0
SCALE = 1.0
FERROR = 0.050
MIN_FERROR = 0.010
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0.1
HOME_LATCH_VEL = 0.02
HOME_SEQUENCE = 0
P = 0
I = 0
D = 0
FF0 = 0
FF1 = 0
FF2 = 0
BIAS = 0
DEADBAND = 0
MAX_OUTPUT = 0.10
MAX_ERROR = 0.100
# 7i49 resolver — see [JOINT_0] block above for units and derivation.
RESOLVER_SCALE = 1.0
RESOLVER_VELOCITY_SCALE = 1.0
RESOLVER_INDEX_DIVISOR = 5
OUTPUT_SCALE = 1.0

[SPINDLE_0]
MAX_FORWARD_VELOCITY = 4000
MAX_REVERSE_VELOCITY = 4000
MIN_FORWARD_VELOCITY = 0
MIN_REVERSE_VELOCITY = 0
# Spindle PID — gains are 0 (open-loop) until closed-loop spindle feedback is
# verified. Once machine-side encoder feedback (hm2_7i80.0.encoder.NN.velocity) is
# confirmed, tune FF1 first (speed feedforward), then add P. MAX_ERROR and
# MAX_OUTPUT limit the closed-loop authority.
P = 0
I = 0
D = 0
FF0 = 0
FF1 = 0
FF2 = 0
BIAS = 0
DEADBAND = 0
MAX_OUTPUT = 10.0
MAX_ERROR = 200
# OUTPUT_SCALE: pwmgen scale for the 7i49 spindle analog output (7i49 AOUT3).
# duty = spindle.0.speed-out / OUTPUT_SCALE, clipped to +/-1.0. spindle.0.speed-out
# is in RPM, so setting OUTPUT_SCALE to the machine's actual max spindle RPM maps
# full-scale +10V to max-RPM. Nameplate max on this class of machine is 4000
# RPM (matches MAX_FORWARD_VELOCITY above). Previous value of 10 made 10 RPM
# equal to full-scale output - a load-blocking bug corrected 2026-08-06.
OUTPUT_SCALE = 4000
