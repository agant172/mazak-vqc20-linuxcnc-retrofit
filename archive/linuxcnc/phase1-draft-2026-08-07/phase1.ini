# ============================================================================
# Mazak VQC 20/40 - PHASE 1 (minimal motion + safety) INI
# ----------------------------------------------------------------------------
# Goal: LinuxCNC comes up and jogs X/Y/Z with resolver feedback, limits, homes,
# drive-enables, and a real E-stop. NO spindle, NO ATC, NO coolant/air/magazine.
# Add those later - see the "PHASE 2" notes in phase1_main.hal.
#
# Only ~15 signals are used here. Every other Mesa pin is simply left unwired;
# LinuxCNC does not care. This WILL load once the hm2_7i80.0.* pin names are
# confirmed from `readhmid`. PID gains are 0 on purpose: the axes HOLD (no
# motion) until you tune FF1/P during bring-up - that is the safe first state.
# ============================================================================

[EMC]
MACHINE = Mazak VQC 20/40 - Phase 1
VERSION = 1.0

[DISPLAY]
DISPLAY = axis
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 1.2
PROGRAM_PREFIX = ~/linuxcnc/nc_files
INCREMENTS = 0.0001in 0.001in 0.01in 0.1in

[KINS]
KINEMATICS = trivkins coordinates=XYZ
JOINTS = 3

[TRAJ]
COORDINATES = X Y Z
LINEAR_UNITS = inch
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 1.0
MAX_LINEAR_VELOCITY = 5.0

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
BASE_PERIOD = 0
SERVO_PERIOD = 1000000

[HAL]
HALFILE = phase1_main.hal
HALFILE = phase1_field.hal
HALUI = halui

[RS274NGC]
PARAMETER_FILE = linuxcnc.var
# No M6 remap in Phase 1 - built-in tool change + manual swap (loopback in HAL).

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

# --------------------------------------------------------------------------
# Axis / joint limits = live M-2 params (main machining envelope only).
# OUTPUT_SCALE maps PID output to the +/-10V command; tune during bring-up.
# PID gains 0 = axis holds until you set FF1 then P (intentional safe state).
# --------------------------------------------------------------------------
[AXIS_X]
MIN_LIMIT = -39.4094
MAX_LIMIT = 0.0394
MAX_VELOCITY = 1.0
MAX_ACCELERATION = 5.0
[JOINT_0]
TYPE = LINEAR
HOME = 0.0
MIN_LIMIT = -39.4094
MAX_LIMIT = 0.0394
MAX_VELOCITY = 1.0
MAX_ACCELERATION = 5.0
FERROR = 0.050
MIN_FERROR = 0.010
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0.1
HOME_LATCH_VEL = 0.02
HOME_SEQUENCE = 1
P = 0
I = 0
D = 0
FF0 = 0
FF1 = 0
FF2 = 0
BIAS = 0
DEADBAND = 0
MAX_OUTPUT = 0.10
MAX_ERROR = 0.100
OUTPUT_SCALE = 1.0

[AXIS_Y]
MIN_LIMIT = -30.0394
MAX_LIMIT = 0.0394
MAX_VELOCITY = 1.0
MAX_ACCELERATION = 5.0
[JOINT_1]
TYPE = LINEAR
HOME = 0.0
MIN_LIMIT = -30.0394
MAX_LIMIT = 0.0394
MAX_VELOCITY = 1.0
MAX_ACCELERATION = 5.0
FERROR = 0.050
MIN_FERROR = 0.010
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0.1
HOME_LATCH_VEL = 0.02
HOME_SEQUENCE = 2
P = 0
I = 0
D = 0
FF0 = 0
FF1 = 0
FF2 = 0
BIAS = 0
DEADBAND = 0
MAX_OUTPUT = 0.10
MAX_ERROR = 0.100
OUTPUT_SCALE = 1.0

[AXIS_Z]
MIN_LIMIT = -18.1496
MAX_LIMIT = 0.0394
MAX_VELOCITY = 1.0
MAX_ACCELERATION = 5.0
[JOINT_2]
TYPE = LINEAR
HOME = 0.0
MIN_LIMIT = -18.1496
MAX_LIMIT = 0.0394
MAX_VELOCITY = 1.0
MAX_ACCELERATION = 5.0
FERROR = 0.050
MIN_FERROR = 0.010
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0.1
HOME_LATCH_VEL = 0.02
HOME_SEQUENCE = 0
P = 0
I = 0
D = 0
FF0 = 0
FF1 = 0
FF2 = 0
